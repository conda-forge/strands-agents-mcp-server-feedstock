{% set name = "strands-agents-mcp-server" %}
{% set version = "0.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/strands_agents_mcp_server-{{ version }}.tar.gz
  sha256: 0a54600e1ab2098e5dd5dcc605bd8e37711b96b96d37747b23dabef06ba069ab

build:
  entry_points:
    - strands-agents-mcp-server = strands_mcp_server.server:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >={{ python_min }}
    - mcp >=1.21.2,<2.2
    - pydantic >=2.0.0

test:
  imports:
    - strands_mcp_server
    - strands_mcp_server.server
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/strands-agents/harness-sdk
  summary: A Model Context Protocol server that provides knowledge about building AI agents with Strands Agents
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  doc_url: https://strandsagents.com
  dev_url: https://github.com/strands-agents/harness-sdk

extra:
  recipe-maintainers:
    - yonib05
    - Unshure
    - athkulk
